    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']], // 配置行内公式符号

        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] // 避开代码块
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
